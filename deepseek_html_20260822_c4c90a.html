<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик потоков Narxoz</title>
    <style>
        /* ---- Глобальные стили ---- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        body.dark {
            background: #1e1e1e;
            color: #eee;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        body.dark .container {
            background: #2d2d2d;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 28px;
            margin-bottom: 15px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            background: #e0e0e0;
            color: #222;
        }
        .btn-primary { background: #2196f3; color: #fff; }
        .btn-primary:hover { background: #1976d2; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #388e3c; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #f57c00; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #d32f2f; }
        .btn-secondary { background: #9e9e9e; color: #fff; }
        .btn-secondary:hover { background: #757575; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }

        /* ---- Статистика ---- */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 15px 0 20px;
        }
        .stat {
            background: #f0f2f5;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        body.dark .stat { background: #3d3d3d; }

        /* ---- Фильтры ---- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .filters input, .filters select {
            padding: 8px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
            flex: 1 1 180px;
        }
        body.dark .filters input,
        body.dark .filters select {
            background: #3d3d3d;
            color: #eee;
            border-color: #555;
        }

        /* ---- Группы дисциплин ---- */
        .group {
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 18px;
            background: #fafafa;
            transition: background 0.3s;
        }
        body.dark .group {
            background: #2a2a2a;
            border-color: #444;
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
            user-select: none;
        }
        .group-header span:last-child {
            font-weight: normal;
            font-size: 13px;
            color: #888;
        }
        body.dark .group-header span:last-child { color: #aaa; }

        /* ---- Таблица ---- */
        .group-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            display: table;
        }
        .group-table th {
            background: #f0f2f5;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
        }
        body.dark .group-table th { background: #3d3d3d; }
        .group-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
        }
        body.dark .group-table td { border-color: #444; }
        .group-table tr.selected { background: #e3f2fd; }
        body.dark .group-table tr.selected { background: #1a3a5a; }

        /* ---- Конфликты ---- */
        .conflict-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .conflict-yes { background: #ffebee; color: #b71c1c; }
        .conflict-no  { background: #e8f5e9; color: #1b5e20; }
        body.dark .conflict-yes { background: #4a2a2a; color: #ff8a80; }
        body.dark .conflict-no  { background: #2a4a2a; color: #81c784; }

        .seats {
            font-weight: bold;
            text-align: center;
        }
        .seats-full { color: #e53935; }
        .seats-low  { color: #f57c00; }
        .seats-ok   { color: #2e7d32; }
        .seats-unknown { color: #888; }

        /* ---- Календарь расписания ---- */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .day-col {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            min-height: 140px;
            background: #f9f9f9;
        }
        body.dark .day-col {
            background: #2a2a2a;
            border-color: #444;
        }
        .day-title {
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .lesson-card {
            font-size: 12px;
            background: #e3f2fd;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        body.dark .lesson-card { background: #1a3a5a; }
        .lesson-card strong { display: block; font-size: 13px; }
        .empty-day { color: #ccc; text-align: center; font-size: 13px; padding-top: 20px; }

        /* ---- Модальное окно ---- */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 60px rgba(0,0,0,0.4);
            z-index: 1000000;
            max-width: 900px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body.dark .modal {
            background: #2d2d2d;
            color: #eee;
        }
        .modal-close {
            float: right;
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 18px;
            cursor: pointer;
        }
        .modal h2 { margin-top: 0; }

        /* ---- Адаптивность ---- */
        @media (max-width: 700px) {
            .container { padding: 15px; }
            .schedule-grid { grid-template-columns: repeat(2, 1fr); }
            .group-table { font-size: 12px; }
            .group-table th, .group-table td { padding: 4px 6px; }
        }
        @media (max-width: 450px) {
            .schedule-grid { grid-template-columns: 1fr; }
        }

        /* ---- Анимация загрузки ---- */
        .loader {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loader::after {
            content: '⏳ Загрузка...';
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>
        📊 Планировщик потоков Narxoz
        <span class="header-actions">
            <button class="btn btn-secondary btn-sm" id="themeToggle">🌙</button>
            <button class="btn btn-warning btn-sm" id="exportCsv">📥 CSV</button>
            <button class="btn btn-primary btn-sm" id="showSchedule">📅 Расписание</button>
            <button class="btn btn-danger btn-sm" id="clearData">🗑️ Очистить</button>
        </span>
    </h1>

    <div id="stats" class="stats"></div>

    <div class="filters" id="filters">
        <input type="text" id="filterText" placeholder="🔍 Фильтр (дисциплина, преподаватель)">
        <select id="dayFilter">
            <option value="">Все дни</option>
            <option value="ПН">ПН</option><option value="ВТ">ВТ</option>
            <option value="СР">СР</option><option value="ЧТ">ЧТ</option>
            <option value="ПТ">ПТ</option><option value="СБ">СБ</option>
            <option value="ВС">ВС</option>
        </select>
        <button class="btn btn-success btn-sm" id="autoSelect">⚡ Автовыбор</button>
        <button class="btn btn-secondary btn-sm" id="refreshData">🔄 Обновить</button>
    </div>

    <div id="content">
        <div class="loader"></div>
    </div>

    <div style="margin-top:20px; font-size:13px; color:#888; border-top:1px solid #ddd; padding-top:12px; display:flex; justify-content:space-between; flex-wrap:wrap;">
        <span>💾 Данные хранятся локально в браузере.</span>
        <span id="updateTime"></span>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ================================================================
        // 1. КОНСТАНТЫ
        // ================================================================
        const STORAGE_KEY = 'narxoz_data';
        const PLAN_KEY = 'narxoz_plan';
        const DAYS = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];

        // ================================================================
        // 2. РАБОТА С ХРАНИЛИЩЕМ
        // ================================================================
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Array.isArray(parsed.streams)) {
                        return parsed;
                    }
                }
            } catch (e) {}
            return null;
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadPlan() {
            try {
                const raw = localStorage.getItem(PLAN_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) { return {}; }
        }

        function savePlan(plan) {
            localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
        }

        // ================================================================
        // 3. ФУНКЦИИ ДЛЯ ВРЕМЕНИ И КОНФЛИКТОВ
        // ================================================================
        function toMinutes(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function overlap(a, b) {
            if (a.day && b.day && a.day !== b.day) return false;
            const aStart = toMinutes(a.start);
            const aEnd = toMinutes(a.end);
            const bStart = toMinutes(b.start);
            const bEnd = toMinutes(b.end);
            return aStart < bEnd && bStart < aEnd;
        }

        function hasConflict(scheduleA, scheduleB) {
            for (const a of scheduleA) {
                for (const b of scheduleB) {
                    if (overlap(a, b)) return true;
                }
            }
            return false;
        }

        function getConflicts(stream, plan, allStreams) {
            const conflicts = [];
            for (const [code, ids] of Object.entries(plan)) {
                for (const id of ids) {
                    const other = allStreams.find(s => s.streamId === id);
                    if (other && hasConflict(stream.schedule, other.schedule)) {
                        conflicts.push(code);
                    }
                }
            }
            return conflicts;
        }

        // ================================================================
        // 4. ОСНОВНОЙ РЕНДЕРИНГ
        // ================================================================
        let allStreams = [];
        let plan = {};

        function render() {
            const content = document.getElementById('content');
            const statsDiv = document.getElementById('stats');
            const timeSpan = document.getElementById('updateTime');

            const data = loadData();
            if (!data) {
                content.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; color:#888;">
                        <h2>📭 Нет данных</h2>
                        <p>Загрузите данные с помощью букмарклета на странице du.narxoz.kz.</p>
                        <p style="font-size:14px; margin-top:10px;">
                            <span style="background:#f0f0f0; padding:4px 12px; border-radius:20px;">Инструкция в букмарклете</span>
                        </p>
                    </div>
                `;
                statsDiv.innerHTML = '';
                timeSpan.textContent = '';
                return;
            }

            allStreams = data.streams || [];
            plan = loadPlan();

            // Группировка
            const groups = {};
            for (const s of allStreams) {
                const code = s.disciplineCode || 'Без названия';
                if (!groups[code]) groups[code] = [];
                groups[code].push(s);
            }

            // Статистика
            const total = Object.keys(groups).length;
            const selectedCount = Object.values(plan).reduce((sum, ids) => sum + ids.length, 0);
            let conflictCount = 0;
            for (const [code, ids] of Object.entries(plan)) {
                for (const id of ids) {
                    const stream = allStreams.find(s => s.streamId === id);
                    if (stream) {
                        const confs = getConflicts(stream, plan, allStreams);
                        if (confs.length > 0) conflictCount++;
                    }
                }
            }
            statsDiv.innerHTML = `
                <span class="stat">📚 Дисциплин: ${total}</span>
                <span class="stat">✅ Выбрано: ${selectedCount}</span>
                <span class="stat">⚠️ Конфликтов: ${conflictCount}</span>
                <span class="stat">🕒 ${new Date().toLocaleString()}</span>
            `;
            timeSpan.textContent = `Обновлено: ${new Date().toLocaleString()}`;

            // Формируем HTML
            let html = '';
            for (const [code, streams] of Object.entries(groups)) {
                const selectedIds = plan[code] || [];
                const hasSelected = selectedIds.length > 0;
                html += `<div class="group" data-code="${code}">
                    <div class="group-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'table' : 'none'">
                        <span>${code}</span>
                        <span>${hasSelected ? `✅ выбрано ${selectedIds.length}` : ''}  ▼</span>
                    </div>
                    <table class="group-table" style="display:table;">
                        <thead><tr>
                            <th style="width:50px;">Выбор</th>
                            <th>Преподаватель</th>
                            <th>Время / Аудитория</th>
                            <th style="width:60px;text-align:center;">Мест</th>
                            <th style="width:130px;text-align:center;">Статус</th>
                        </tr></thead>
                        <tbody>
                `;
                for (const s of streams) {
                    const checked = selectedIds.includes(s.streamId) ? 'checked' : '';
                    const confs = getConflicts(s, plan, allStreams);
                    const conflictText = confs.length ? `⚠️ ${confs.join(', ')}` : '✅';
                    const conflictClass = confs.length ? 'conflict-yes' : 'conflict-no';
                    const scheduleStr = s.schedule.map(t => `${t.day || ''} ${t.start}-${t.end}`).join(', ');
                    const locationStr = s.location ? `📍 ${s.location}` : '';
                    const seats = s.seatsLeft;
                    let seatsClass = 'seats-unknown';
                    if (seats === -1) seatsClass = 'seats-unknown';
                    else if (seats <= 0) seatsClass = 'seats-full';
                    else if (seats <= 5) seatsClass = 'seats-low';
                    else seatsClass = 'seats-ok';
                    const seatsDisplay = seats === -1 ? '—' : seats;
                    const rowClass = checked ? 'selected' : '';
                    html += `
                        <tr class="${rowClass}" data-teacher="${s.teacherName.toLowerCase()}" data-schedule="${scheduleStr.toLowerCase()}">
                            <td><input type="checkbox" data-code="${code}" data-stream="${s.streamId}" ${checked}></td>
                            <td>${s.teacherName}</td>
                            <td>${scheduleStr} ${locationStr}</td>
                            <td class="seats ${seatsClass}">${seatsDisplay}</td>
                            <td style="text-align:center;"><span class="conflict-badge ${conflictClass}">${conflictText}</span> ${s.status ? ' | ' + s.status : ''}</td>
                        </tr>
                    `;
                }
                html += `</tbody></table></div>`;
            }
            content.innerHTML = html;

            // ---- Обработчики чекбоксов ----
            document.querySelectorAll('#content input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    const code = this.dataset.code;
                    const streamId = this.dataset.stream;
                    if (!plan[code]) plan[code] = [];
                    if (this.checked) {
                        if (!plan[code].includes(streamId)) plan[code].push(streamId);
                    } else {
                        plan[code] = plan[code].filter(id => id !== streamId);
                        if (plan[code].length === 0) delete plan[code];
                    }
                    savePlan(plan);
                    render();
                });
            });

            // ---- Фильтр текстовый ----
            const filterInput = document.getElementById('filterText');
            filterInput.addEventListener('input', function() {
                const val = this.value.toLowerCase();
                document.querySelectorAll('.group').forEach(group => {
                    const text = group.textContent.toLowerCase();
                    group.style.display = text.includes(val) ? 'block' : 'none';
                });
            });

            // ---- Фильтр по дню ----
            document.getElementById('dayFilter').addEventListener('change', function() {
                const day = this.value.toLowerCase();
                document.querySelectorAll('.group-table tbody tr').forEach(row => {
                    const schedule = row.dataset.schedule || '';
                    if (day === '' || schedule.includes(day)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });

            // ---- Автовыбор ----
            document.getElementById('autoSelect').addEventListener('click', function() {
                const newPlan = {};
                for (const [code, ids] of Object.entries(plan)) {
                    newPlan[code] = [...ids];
                }
                for (const [code, streams] of Object.entries(groups)) {
                    if (newPlan[code] && newPlan[code].length > 0) continue;
                    const sorted = [...streams].sort((a,b) => b.seatsLeft - a.seatsLeft);
                    for (const s of sorted) {
                        const confs = getConflicts(s, newPlan, allStreams);
                        if (confs.length === 0 && s.seatsLeft !== 0) {
                            newPlan[code] = [s.streamId];
                            break;
                        }
                    }
                }
                savePlan(newPlan);
                plan = newPlan;
                render();
            });
        }

        // ================================================================
        // 5. ДОПОЛНИТЕЛЬНЫЕ ДЕЙСТВИЯ (расписание, CSV, очистка)
        // ================================================================

        function showScheduleModal() {
            const data = loadData();
            if (!data) return alert('Нет данных.');
            const streams = data.streams || [];
            const plan = loadPlan();
            const selected = [];
            for (const [code, ids] of Object.entries(plan)) {
                for (const id of ids) {
                    const s = streams.find(st => st.streamId === id);
                    if (s) selected.push({ ...s, disciplineCode: code });
                }
            }
            if (selected.length === 0) {
                alert('Нет выбранных потоков.');
                return;
            }

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <button class="modal-close" onclick="this.closest('.modal').remove()">✕ Закрыть</button>
                <h2>📅 Ваше расписание</h2>
                <div class="schedule-grid">
                    ${DAYS.map(day => {
                        const items = selected.filter(s => s.schedule.some(t => t.day === day));
                        return `<div class="day-col">
                            <div class="day-title">${day}</div>
                            ${items.length === 0 ? '<div class="empty-day">—</div>' : 
                                items.map(item => {
                                    const times = item.schedule.filter(t => t.day === day).map(t => `${t.start}-${t.end}`).join(', ');
                                    return `<div class="lesson-card"><strong>${item.disciplineCode}</strong>${item.teacherName}<br><span style="color:#555;font-size:11px;">${times}</span></div>`;
                                }).join('')
                            }
                        </div>`;
                    }).join('')}
                </div>
            `;
            document.body.appendChild(modal);
            // Поддержка тёмной темы
            if (document.body.classList.contains('dark')) {
                modal.style.background = '#2d2d2d';
                modal.style.color = '#eee';
            }
        }

        function exportCSV() {
            const data = loadData();
            if (!data) return alert('Нет данных.');
            const streams = data.streams || [];
            const plan = loadPlan();
            const rows = ['Дисциплина,Преподаватель,День,Начало,Конец,Аудитория,Мест'];
            for (const [code, ids] of Object.entries(plan)) {
                for (const id of ids) {
                    const s = streams.find(st => st.streamId === id);
                    if (s) {
                        for (const slot of s.schedule) {
                            rows.push(`${code},${s.teacherName},${slot.day || ''},${slot.start},${slot.end},${s.location || ''},${s.seatsLeft}`);
                        }
                    }
                }
            }
            const csv = rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'plan.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('Удалить все данные и план?')) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(PLAN_KEY);
                render();
            }
        }

        // ================================================================
        // 6. ТЁМНАЯ ТЕМА
        // ================================================================
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const btn = document.getElementById('themeToggle');
            btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        }

        // ================================================================
        // 7. ИНИЦИАЛИЗАЦИЯ
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Восстановление темы
            if (localStorage.getItem('narxoz_theme') === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeToggle').textContent = '☀️';
            }

            // Обработчики кнопок
            document.getElementById('themeToggle').addEventListener('click', function() {
                toggleTheme();
                localStorage.setItem('narxoz_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
            });

            document.getElementById('showSchedule').addEventListener('click', showScheduleModal);
            document.getElementById('exportCsv').addEventListener('click', exportCSV);
            document.getElementById('clearData').addEventListener('click', clearAllData);

            // Кнопка "Обновить" просто перерисовывает
            document.getElementById('refreshData').addEventListener('click', render);

            // Первый рендеринг
            render();

            // Если данных нет, показываем подсказку
            const data = loadData();
            if (!data) {
                // Показываем инструкцию
                const content = document.getElementById('content');
                content.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; color:#555;">
                        <h2>📭 Нет данных</h2>
                        <p>Чтобы загрузить данные с du.narxoz.kz, добавьте букмарклет:</p>
                        <ol style="display:inline-block; text-align:left; margin:20px auto; line-height:1.8;">
                            <li><strong>Создайте закладку</strong> в браузере (любое имя).</li>
                            <li>В адрес закладки вставьте код из <strong>букмарклета</strong> (см. ниже).</li>
                            <li>Зайдите на <code>du.narxoz.kz</code>, авторизуйтесь, перейдите на страницу с потоками.</li>
                            <li>Нажмите на закладку — данные соберутся, и вы вернётесь сюда.</li>
                        </ol>
                        <div style="background:#f0f0f0; padding:12px; border-radius:8px; max-width:600px; margin:0 auto; text-align:left; font-size:13px; word-break:break-all;">
                            <strong>Букмарклет:</strong><br>
                            <code id="bookmarklet-code" style="background:#fff; padding:4px 8px; border-radius:4px; display:block; margin-top:4px; overflow-x:auto;"></code>
                            <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="copyBookmarklet()">📋 Скопировать</button>
                        </div>
                    </div>
                `;
                // Вставляем код букмарклета
                const code = generateBookmarkletCode();
                document.getElementById('bookmarklet-code').textContent = code;
                window.copyBookmarklet = function() {
                    const el = document.getElementById('bookmarklet-code');
                    navigator.clipboard.writeText(el.textContent).then(() => alert('Букмарклет скопирован!'));
                };
            }
        });

        // ================================================================
        // 8. ГЕНЕРАЦИЯ БУКМАРКЛЕТА
        // ================================================================
        function generateBookmarkletCode() {
            // Код букмарклета – минифицированный скрипт-сборщик
            const script = `
                (function() {
                    // Сборщик данных с du.narxoz.kz
                    function parseStreams() {
                        const result = [];
                        const cards = document.querySelectorAll('.stream-card, .stream-item, [class*="stream"], .flow-item, .course-stream');
                        for (const card of cards) {
                            const discipline = card.querySelector('.discipline-name, .course-title, h4')?.textContent?.trim() || 'Неизвестно';
                            const location = card.querySelector('.location, .room, .auditorium')?.textContent?.trim() || '';
                            const capacityText = card.querySelector('.capacity, .seats, .count')?.textContent?.trim() || '';
                            const status = card.querySelector('.status, .state, .badge')?.textContent?.trim() || '';
                            const teacher = card.querySelector('.teacher, .instructor')?.textContent?.trim() || 'Не указан';
                            const timeText = card.querySelector('.time, .schedule')?.textContent?.trim() || '';
                            let seatsLeft = 0;
                            const match = capacityText.match(/(\\d+)\\s*\\/\\s*(\\d+)/);
                            if (match) seatsLeft = parseInt(match[1], 10);
                            else seatsLeft = parseInt(capacityText, 10) || 0;
                            const schedule = parseScheduleText(timeText);
                            result.push({
                                disciplineCode: discipline,
                                streamId: card.dataset.streamId || 's-' + Date.now() + '-' + Math.random(),
                                teacherName: teacher,
                                seatsLeft: seatsLeft,
                                location: location,
                                status: status,
                                schedule: schedule
                            });
                        }
                        return result;
                    }

                    function parseScheduleText(text) {
                        const slots = [];
                        const parts = text.split(',').map(s => s.trim());
                        for (const part of parts) {
                            const match = part.match(/([А-ЯЁа-яё]{2,3})\\s+(\\d{2}:\\d{2})\\s*[-–]\\s*(\\d{2}:\\d{2})/);
                            if (match) slots.push({ day: match[1], start: match[2], end: match[3] });
                        }
                        return slots;
                    }

                    function parseSchedule() {
                        const result = [];
                        const grid = document.querySelector('.schedule-grid, .timetable, [class*="schedule"]');
                        if (!grid) return result;
                        const cells = grid.querySelectorAll('.slot, .lesson, .event, td:not(:empty)');
                        for (const cell of cells) {
                            const text = cell.textContent.trim();
                            if (!text) continue;
                            const lines = text.split('\\n').map(s => s.trim()).filter(Boolean);
                            if (lines.length < 2) continue;
                            const timeStr = lines[0];
                            const discipline = lines[1] || 'Неизвестно';
                            const room = lines[2] || '';
                            const day = cell.closest('.day-column, .day, .col')?.dataset?.day || '';
                            const match = timeStr.match(/(\\d{2}:\\d{2})\\s*[-–]\\s*(\\d{2}:\\d{2})/);
                            let start = '', end = '';
                            if (match) { start = match[1]; end = match[2]; }
                            const teacher = cell.dataset.teacher || '';
                            result.push({
                                disciplineCode: discipline,
                                streamId: 'sched-' + Date.now() + '-' + Math.random(),
                                teacherName: teacher || 'Не указан',
                                seatsLeft: -1,
                                location: room,
                                status: 'Запланировано',
                                schedule: [{ day: day, start: start, end: end }]
                            });
                        }
                        return result;
                    }

                    function detectPageType() {
                        if (document.querySelector('.stream-card, .stream-item, [class*="stream"]')) return 'streams';
                        if (document.querySelector('.schedule-grid, .timetable, [class*="schedule"]')) return 'schedule';
                        return 'unknown';
                    }

                    let streams = [];
                    const pageType = detectPageType();
                    if (pageType === 'streams') streams = parseStreams();
                    else if (pageType === 'schedule') streams = parseSchedule();

                    if (!streams.length) {
                        alert('Не удалось найти данные. Перейдите на страницу выбора потоков или расписания.');
                        return;
                    }

                    // Загружаем существующий план, если есть
                    let plan = {};
                    try { plan = JSON.parse(localStorage.getItem('narxoz_plan') || '{}'); } catch(e) {}

                    const data = { streams, plan };
                    localStorage.setItem('narxoz_data', JSON.stringify(data));
                    // Перенаправляем на GitHub Pages
                    const baseUrl = window.location.origin + window.location.pathname;
                    window.location.href = 'https://dimawggwp.github.io/autopeakernx/';
                })();
            `;
            // Минифицируем: убираем лишние пробелы и переносы
            const minified = script.replace(/\s+/g, ' ').trim();
            return 'javascript:' + encodeURIComponent(minified);
        }

    })();
</script>
</body>
</html>
